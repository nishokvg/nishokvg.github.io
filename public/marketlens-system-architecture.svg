<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">MarketLens system architecture</title>
  <desc id="desc">Evidence-first apparel competitor research workflow built with Streamlit and LangGraph, with optional memory and retrieval layers and a required human approval gate.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#edf4f7"/></linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0d3653"/><stop offset="1" stop-color="#145c72"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#16415c" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#547084"/></marker>
    <style>
      .title{font:700 39px 'JetBrains Mono',monospace;fill:#fff}.subtitle{font:500 17px 'JetBrains Mono',monospace;fill:#d4eef0}.kicker{font:700 15px 'JetBrains Mono',monospace;letter-spacing:2px;fill:#3885a2}.h{font:700 23px 'JetBrains Mono',monospace;fill:#133c58}.sh{font:700 18px 'JetBrains Mono',monospace;fill:#173e59}.body{font:500 15px 'JetBrains Mono',monospace;fill:#40596a}.small{font:500 13px 'JetBrains Mono',monospace;fill:#526979}.num{font:700 18px 'JetBrains Mono',monospace;fill:#fff}.chip{font:700 13px 'JetBrains Mono',monospace;fill:#23475d}.tech{font:700 15px 'JetBrains Mono',monospace;fill:#1a3b50}.accent{font:700 16px 'JetBrains Mono',monospace;fill:#0d665f}.warn{font:700 16px 'JetBrains Mono',monospace;fill:#8b5f10}.gate{font:700 18px 'JetBrains Mono',monospace;fill:#8c421f}.line{stroke:#547084;stroke-width:2.6;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1600" height="1200" fill="url(#page)"/>
  <rect x="35" y="30" width="1530" height="105" rx="20" fill="url(#hero)" filter="url(#shadow)"/>
  <text x="76" y="78" class="title">MarketLens AI</text>
  <text x="76" y="109" class="subtitle">Evidence-first competitor intelligence for apparel sourcing</text>
  <text x="1510" y="80" class="subtitle" text-anchor="end">3–10 competitors</text>
  <text x="1510" y="108" class="subtitle" text-anchor="end">Cite or mark Unknown</text>

  <!-- left: purpose and constraints -->
  <rect x="35" y="165" width="305" height="735" rx="18" fill="#fff" stroke="#c8d9e3" stroke-width="2" filter="url(#shadow)"/>
  <text x="62" y="210" class="kicker">WHAT IT DOES</text>
  <text x="62" y="250" class="h">Research brief in.</text>
  <text x="62" y="280" class="h">Evidence-backed brief out.</text>
  <line x1="62" y1="307" x2="313" y2="307" stroke="#d7e3eb" stroke-width="2"/>
  <circle cx="77" cy="346" r="13" fill="#1c7b9c"/><text x="77" y="352" class="num" text-anchor="middle">1</text><text x="105" y="351" class="body">Accept sourcing brief</text>
  <circle cx="77" cy="392" r="13" fill="#1c7b9c"/><text x="77" y="398" class="num" text-anchor="middle">2</text><text x="105" y="397" class="body">Discover competitors</text>
  <circle cx="77" cy="438" r="13" fill="#1c7b9c"/><text x="77" y="444" class="num" text-anchor="middle">3</text><text x="105" y="443" class="body">Collect public sources</text>
  <circle cx="77" cy="484" r="13" fill="#1c7b9c"/><text x="77" y="490" class="num" text-anchor="middle">4</text><text x="105" y="489" class="body">Compare requested fields</text>
  <circle cx="77" cy="530" r="13" fill="#1c7b9c"/><text x="77" y="536" class="num" text-anchor="middle">5</text><text x="105" y="535" class="body">Review evidence gaps</text>

  <rect x="55" y="574" width="265" height="145" rx="14" fill="#eef9f4" stroke="#acd8c5" stroke-width="2"/>
  <text x="77" y="613" class="accent">TRUST RULES</text>
  <text x="77" y="646" class="small">• source-backed fields only</text>
  <text x="77" y="674" class="small">• Unknown if unsupported</text>
  <text x="77" y="702" class="small">• web text is untrusted data</text>

  <rect x="55" y="742" width="265" height="130" rx="14" fill="#fff7e3" stroke="#e5c981" stroke-width="2"/>
  <text x="77" y="781" class="warn">COVERAGE ≠ ACCURACY</text>
  <text x="77" y="813" class="small">Coverage measures supported</text>
  <text x="77" y="838" class="small">comparison points, not truth.</text>

  <!-- UI -->
  <rect x="375" y="450" width="175" height="180" rx="18" fill="#fff" stroke="#82b5ca" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="410" y="485" width="105" height="73" rx="10" fill="#e6f3f8" stroke="#397897" stroke-width="2"/>
  <rect x="425" y="498" width="75" height="45" rx="5" fill="#fff"/>
  <rect x="435" y="512" width="18" height="20" rx="2" fill="#2785a5"/><rect x="459" y="505" width="13" height="27" rx="2" fill="#70b8ca"/><rect x="478" y="495" width="13" height="37" rx="2" fill="#badde7"/>
  <text x="462" y="590" class="sh" text-anchor="middle">Streamlit UI</text>
  <text x="462" y="614" class="small" text-anchor="middle">brief + stage visibility</text>

  <!-- center architecture -->
  <rect x="585" y="165" width="650" height="735" rx="18" fill="#fff" stroke="#93b8cb" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="910" y="210" class="kicker" text-anchor="middle">LANGGRAPH ORCHESTRATOR + RESEARCH STATE</text>
  <text x="910" y="242" class="small" text-anchor="middle">brief · competitors · sources · facts · coverage · integration status · review notes</text>
  <line x1="550" y1="540" x2="585" y2="540" class="line"/>

  <!-- stages -->
  <g>
    <rect x="615" y="272" width="590" height="66" rx="12" fill="#edf7fb" stroke="#8abbd1" stroke-width="2"/>
    <circle cx="649" cy="305" r="18" fill="#1d7197"/><text x="649" y="312" class="num" text-anchor="middle">1</text>
    <text x="686" y="299" class="sh">Load context</text><text x="686" y="321" class="small">optional Mem0 recall + source retrieval</text>
    <path d="M910 338V356" class="line"/>

    <rect x="615" y="360" width="590" height="66" rx="12" fill="#eef8f4" stroke="#9ccdb9" stroke-width="2"/>
    <circle cx="649" cy="393" r="18" fill="#18765e"/><text x="649" y="400" class="num" text-anchor="middle">2</text>
    <text x="686" y="387" class="sh">Discover competitors</text><text x="686" y="409" class="small">known candidates + Tavily discovery; de-duplicate; honor requested limit</text>
    <path d="M910 426V444" class="line"/>

    <rect x="615" y="448" width="590" height="66" rx="12" fill="#eef8f4" stroke="#9ccdb9" stroke-width="2"/>
    <circle cx="649" cy="481" r="18" fill="#18765e"/><text x="649" y="488" class="num" text-anchor="middle">3</text>
    <text x="686" y="475" class="sh">Collect public evidence</text><text x="686" y="497" class="small">bounded concurrent Tavily research for each competitor</text>
    <path d="M910 514V532" class="line"/>

    <rect x="615" y="536" width="590" height="66" rx="12" fill="#f3f0fb" stroke="#b8acd7" stroke-width="2"/>
    <circle cx="649" cy="569" r="18" fill="#70519f"/><text x="649" y="576" class="num" text-anchor="middle">4</text>
    <text x="686" y="563" class="sh">Index available sources</text><text x="686" y="585" class="small">optional LlamaIndex + Pinecone namespace; safe if unavailable</text>
    <path d="M910 602V620" class="line"/>

    <rect x="615" y="624" width="590" height="66" rx="12" fill="#edf7fb" stroke="#8abbd1" stroke-width="2"/>
    <circle cx="649" cy="657" r="18" fill="#1d7197"/><text x="649" y="664" class="num" text-anchor="middle">5</text>
    <text x="686" y="651" class="sh">Extract comparable facts</text><text x="686" y="673" class="small">schema-bound model when enabled; conservative source fallback otherwise</text>
    <path d="M910 690V708" class="line"/>

    <rect x="615" y="712" width="590" height="66" rx="12" fill="#fff7e3" stroke="#e5c981" stroke-width="2"/>
    <circle cx="649" cy="745" r="18" fill="#a67018"/><text x="649" y="752" class="num" text-anchor="middle">6</text>
    <text x="686" y="739" class="sh">Analyze and review</text><text x="686" y="761" class="small">comparison table + coverage score + visible follow-up warnings</text>
  </g>

  <!-- right integration layers -->
  <rect x="1265" y="165" width="300" height="735" rx="18" fill="#fff" stroke="#c8d9e3" stroke-width="2" filter="url(#shadow)"/>
  <text x="1292" y="210" class="kicker">OPTIONAL LAYERS</text>
  <rect x="1285" y="237" width="260" height="124" rx="13" fill="#edf7fb" stroke="#99bfd0" stroke-width="2"/>
  <text x="1307" y="274" class="sh">Tavily</text><text x="1307" y="300" class="small">live discovery + public</text><text x="1307" y="321" class="small">competitor evidence</text>
  <rect x="1285" y="383" width="260" height="124" rx="13" fill="#eef8f4" stroke="#a4ceb9" stroke-width="2"/>
  <text x="1307" y="420" class="sh">Mem0</text><text x="1307" y="446" class="small">approved, user-scoped</text><text x="1307" y="467" class="small">research context</text>
  <rect x="1285" y="529" width="260" height="124" rx="13" fill="#f3f0fb" stroke="#c0b5da" stroke-width="2"/>
  <text x="1307" y="566" class="sh">Pinecone + LlamaIndex</text><text x="1307" y="592" class="small">optional source indexing</text><text x="1307" y="613" class="small">and retrieval</text>
  <rect x="1285" y="675" width="260" height="164" rx="13" fill="#fff7e3" stroke="#e3c680" stroke-width="2"/>
  <text x="1307" y="712" class="sh">Model extraction</text><text x="1307" y="738" class="small">OpenAI-compatible</text><text x="1307" y="759" class="small">structured output only</text><text x="1307" y="792" class="warn">Never infer facts.</text><text x="1307" y="815" class="warn">Every claim needs evidence.</text>

  <!-- handoff & human gate -->
  <path d="M910 778V928" class="line"/>
  <rect x="350" y="930" width="900" height="126" rx="18" fill="#fff4e9" stroke="#d58357" stroke-width="3" stroke-dasharray="10 7"/>
  <text x="800" y="968" class="gate" text-anchor="middle">EXPLICIT USER ACTIONS ONLY</text>
  <rect x="385" y="986" width="250" height="44" rx="11" fill="#fff" stroke="#d79a78" stroke-width="2"/>
  <text x="510" y="1014" class="chip" text-anchor="middle">Human approves draft</text>
  <path d="M635 1008H705" class="line"/>
  <rect x="712" y="986" width="215" height="44" rx="11" fill="#fff" stroke="#d79a78" stroke-width="2"/>
  <text x="820" y="1014" class="chip" text-anchor="middle">Prepare download</text>
  <path d="M927 1008H997" class="line"/>
  <rect x="1004" y="986" width="210" height="44" rx="11" fill="#fff" stroke="#d79a78" stroke-width="2"/>
  <text x="1109" y="1014" class="chip" text-anchor="middle">Store approved context</text>

  <!-- tech row -->
  <rect x="35" y="1080" width="1530" height="82" rx="16" fill="#fff" stroke="#c8d9e3" stroke-width="2"/>
  <text x="65" y="1129" class="kicker">TECH STACK</text>
  <g>
    <rect x="245" y="1100" width="130" height="40" rx="10" fill="#eef4f7"/><text x="310" y="1126" class="tech" text-anchor="middle">Python</text>
    <rect x="392" y="1100" width="145" height="40" rx="10" fill="#eef4f7"/><text x="465" y="1126" class="tech" text-anchor="middle">Streamlit</text>
    <rect x="554" y="1100" width="150" height="40" rx="10" fill="#eef4f7"/><text x="629" y="1126" class="tech" text-anchor="middle">LangGraph</text>
    <rect x="721" y="1100" width="155" height="40" rx="10" fill="#eef4f7"/><text x="798" y="1126" class="tech" text-anchor="middle">LangChain</text>
    <rect x="893" y="1100" width="130" height="40" rx="10" fill="#eef4f7"/><text x="958" y="1126" class="tech" text-anchor="middle">Tavily</text>
    <rect x="1040" y="1100" width="130" height="40" rx="10" fill="#eef4f7"/><text x="1105" y="1126" class="tech" text-anchor="middle">Pydantic</text>
    <rect x="1187" y="1100" width="110" height="40" rx="10" fill="#eef4f7"/><text x="1242" y="1126" class="tech" text-anchor="middle">Mem0</text>
    <rect x="1314" y="1100" width="210" height="40" rx="10" fill="#eef4f7"/><text x="1419" y="1126" class="tech" text-anchor="middle">Pinecone + LlamaIndex</text>
  </g>
</svg>
