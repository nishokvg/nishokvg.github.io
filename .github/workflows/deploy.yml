name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Triggered by a push to the nishok-notes repo (see that repo's notify-site workflow).
  repository_dispatch:
    types: [notes-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pull in the notes content (public repo) so /notes can be built.
      - uses: actions/checkout@v4
        with:
          repository: nishokvg/nishok-notes
          path: _notes-src
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NOTES_SRC: ${{ github.workspace }}/_notes-src
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
